name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo:
    name: frontmatter, EN/ES parity, links, length, plugin layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - run: python3 scripts/check.py

  claude-plugin:
    name: Claude Code plugin validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Pinned to the version these manifests were tested with; offline, needs no credentials.
      - run: npx --yes @anthropic-ai/claude-code@2.1.300 plugin validate .
      - run: npx --yes @anthropic-ai/claude-code@2.1.300 plugin validate es
